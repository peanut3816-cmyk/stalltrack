<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>stalltrack</title>
<meta name="description" content="Free pre-market checklist, sales log and cash-up for market stallholders. From oat.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="stalltrack">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F6F4F1">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/quicksand-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Quicksand";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/quicksand-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Quicksand";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/quicksand-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Quicksand";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/quicksand-latin-700-normal.woff2") format("woff2")}

@font-face{font-family:"Figtree";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/figtree-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Figtree";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/figtree-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Figtree";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/figtree-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Figtree";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/figtree-latin-700-normal.woff2") format("woff2")}

:root{
  --page:#F6F4F1; --card:#FFFFFF; --border:#E3DED8; --ink:#1E1C1A;
  --muted:#6B6560; --faint:#9D968E; --btn:#2B2B2B; --chip:#ECEBE8; --chip-ink:#4A4744;
  --check:#D8D2CA; --delete:#B91C1C; --red:#DC2626;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--page)}
body{
  color:var(--ink);font-family:"Figtree",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  font-weight:400;font-size:16px;line-height:1.35;
  max-width:430px;margin:0 auto;min-height:100vh;
  padding:calc(14px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}

/* logo */
/* Quicksand is used only for the brand: splash, oat wordmark and the header name */
.wm,#splash,.top .name{font-family:"Quicksand",system-ui,sans-serif}
.wm{display:inline-flex;align-items:baseline;line-height:1;font-weight:700;letter-spacing:-.02em;color:var(--ink)}
.wm svg{margin-left:.1em;transform:translateY(.08em);flex:none}

/* splash */
#splash{
  position:fixed;inset:0;z-index:50;background:var(--page);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  text-align:center;transition:opacity .25s ease;cursor:pointer;
}
#splash.out{opacity:0;pointer-events:none}
#splash .hero{font-size:44px;font-weight:700;letter-spacing:-.02em}
#splash .tagline{color:var(--muted);font-size:13px;letter-spacing:1.5px}
#splash .from{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));display:flex;align-items:baseline;gap:6px;color:var(--muted);font-size:12px}
@media (prefers-reduced-motion:reduce){#splash{transition:none}}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding:8px 2px 14px}
.top .name{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:.01em}

/* cards */
.card{background:var(--card);border:.5px solid var(--border);border-radius:16px;padding:12px 16px;margin-bottom:10px}
.lbl{display:block;font-size:12px;color:var(--muted);margin-bottom:2px;font-weight:600}
.field{width:100%;border:none;outline:none;background:transparent;padding:2px 0;font-size:16px;font-weight:500}
.field::placeholder{color:var(--faint);font-weight:400}
textarea.field{resize:none;min-height:44px;font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.split{border-top:1px solid var(--border);margin-top:10px;padding-top:10px}
.datebox{position:relative;min-height:26px;display:flex;align-items:center}
.datebox span{font-size:16px;font-weight:500}
.datebox span.empty{color:var(--faint);font-weight:400}
.datebox input{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;cursor:pointer}

/* progress + section rows */
.prog{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 6px;color:var(--muted);font-size:13px;font-weight:600}
.link{border:none;background:none;color:var(--muted);font-size:13px;font-weight:600;padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.bar{height:4px;background:var(--border);border-radius:2px;margin:0 2px 14px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--btn);border-radius:2px;transition:width .2s ease}
.sec{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px;font-weight:600;margin:14px 2px 6px}
.chip{background:var(--chip);color:var(--chip-ink);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600}

/* items */
.list{padding:0 16px}
.item{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:1px solid var(--border)}
.item:last-child{border-bottom:none}
.box{
  width:26px;height:26px;flex:0 0 26px;border-radius:8px;border:2px solid var(--check);
  background:transparent;padding:0;display:inline-flex;align-items:center;justify-content:center;color:#fff;
}
.box svg{display:none}
.packed .box{background:var(--btn);border-color:var(--btn)}
.packed .box svg{display:block}
.hit{flex:1;display:flex;align-items:center;gap:10px;min-height:52px;border:none;background:none;text-align:left;padding:0;font-size:16px;font-weight:500}
.packed .txt{color:var(--faint);text-decoration:line-through}
.x{border:none;background:none;color:var(--faint);font-size:22px;line-height:1;width:44px;height:44px;margin-right:-10px}
.x:active{color:var(--delete)}
.done-msg{text-align:center;color:var(--muted);font-weight:600;padding:18px 0}

/* collapsible packed */
.fold{width:100%;display:flex;justify-content:space-between;align-items:center;border:.5px solid var(--border);background:var(--card);border-radius:16px;padding:14px 16px;font-size:14px;font-weight:600;color:var(--muted)}
.fold .car{transition:transform .15s ease}
.fold[aria-expanded="true"] .car{transform:rotate(90deg)}

/* empty + add */
.empty-card{text-align:center;padding:22px 16px}
.empty-card b{display:block;font-size:17px;margin-bottom:4px}
.empty-card span{color:var(--muted);font-size:14px}
.add{display:flex;align-items:center;gap:8px}
.add .field{flex:1}
.addbtn{width:44px;height:44px;border:none;border-radius:12px;background:var(--btn);color:#fff;font-size:24px;line-height:1;flex:none}
.addbtn:disabled{opacity:.35}
.groupfield{margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}

/* placeholder tabs */
.soon{text-align:center;color:var(--muted);padding:60px 16px}
.soon b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}

/* header gear */
.right{display:flex;align-items:center;gap:2px}
.gear{border:none;background:none;width:44px;height:44px;margin-right:-12px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;font-weight:600}
.gear svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* sales */
.seg{display:flex;gap:4px;background:var(--chip);border-radius:12px;padding:3px;margin-bottom:8px}
.seg button{flex:1;border:none;background:transparent;border-radius:9px;min-height:40px;font-size:14px;font-weight:600;color:var(--chip-ink)}
.seg button.on{background:var(--btn);color:#fff}
.total{background:var(--btn);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.total b{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.total span{font-size:12px;color:#C9C3BA;font-weight:600;text-align:right}
.dot{color:var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.tile{position:relative;background:var(--card);border:.5px solid var(--border);border-radius:14px;padding:16px 8px 12px;min-height:80px;text-align:center;font-weight:700;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tile small{font-size:13px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.tile .tg{position:absolute;top:6px;right:10px;font-size:10px;font-weight:600;color:var(--faint)}
.tile.quiet{min-height:56px;color:var(--muted);font-weight:600;font-size:14px;padding:10px 8px}
.tile:active{background:var(--chip)}
.locked .tile,.locked .srow{opacity:.45;pointer-events:none}
.srow{display:flex;align-items:center;gap:8px;min-height:52px;width:100%;background:none;border:none;border-bottom:.5px solid var(--border);padding:0;text-align:left;font-size:15px}
.srow:last-child{border-bottom:none}
.srow .tm{width:56px;flex:none;color:var(--muted);font-size:12px;font-weight:600}
.srow .nm{flex:1;font-weight:600;min-width:0;overflow-wrap:anywhere}
.srow .am{font-weight:700;font-variant-numeric:tabular-nums;min-width:60px;text-align:right}
.chip.sm{padding:1px 8px;font-size:11px}
.flag{color:var(--red);font-size:11px;font-weight:700;margin-left:4px;white-space:nowrap}
.btn{display:block;width:100%;border:none;background:var(--btn);color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:700;text-align:center}
.btn.o{background:var(--card);color:var(--ink);border:.5px solid var(--border)}
.btn.del{background:var(--card);color:var(--delete);border:.5px solid var(--border)}
.btn:disabled{opacity:.35}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}.row2 .btn.big{flex:2}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.head b{font-size:17px}
.fld{background:var(--card);border:.5px solid var(--border);border-radius:12px;padding:7px 12px;margin-bottom:8px}
.fld .lbl{margin-bottom:0}
.fld .field{font-size:16px}
.err{color:var(--red);font-size:13px;font-weight:600;margin:0 2px 8px}
.note{color:var(--muted);font-size:13px;margin:6px 2px 12px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.pad button{background:var(--card);border:.5px solid var(--border);border-radius:14px;min-height:58px;font-size:22px;font-weight:600}
.pad button:active{background:var(--chip)}
.amt{background:var(--btn);color:#fff;border-radius:14px;padding:10px 16px;margin-bottom:8px;text-align:right}
.amt small{display:block;font-size:12px;color:#C9C3BA;font-weight:600}
.amt b{font-size:36px;font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chips .chip{border:none;font-size:14px;padding:8px 12px;min-height:36px}
.chips .chip.add{border:.5px dashed var(--faint);background:var(--card)}
.mini{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.mini .fld{flex:1;margin:0}
.lockbar{background:var(--chip);border-radius:14px;padding:12px 16px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.lockbar b{display:block}.lockbar span{font-size:13px;color:var(--muted)}
.lockbar .btn{width:auto;padding:10px 16px}
.pm{display:flex;align-items:center;gap:12px;min-height:52px;border-bottom:.5px solid var(--border)}
.pm:last-child{border-bottom:none}
.pm span.n{flex:1;font-weight:600}.pm .s{color:var(--muted);font-size:13px}
.tgl{width:46px;height:28px;border-radius:14px;background:var(--check);border:none;position:relative;flex:none}
.tgl i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .15s ease}
.tgl[aria-checked="true"]{background:var(--btn)}
.tgl[aria-checked="true"] i{left:21px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));width:min(398px,calc(100% - 32px));z-index:20;background:var(--btn);color:#fff;border-radius:12px;padding:6px 8px 6px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:600;font-size:14px}
#toast button{border:none;background:none;color:#fff;font-weight:700;font-size:15px;padding:10px 12px;text-decoration:underline;text-underline-offset:3px}

/* tab bar */
nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);z-index:10;
  padding:8px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--page) 75%,rgba(246,244,241,0));
}
.tabs{display:flex;gap:4px;background:var(--card);border:.5px solid var(--border);border-radius:16px;padding:4px}
.tabs button{flex:1;border:none;background:transparent;border-radius:12px;min-height:48px;font-size:12px;font-weight:600;color:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button.on{background:var(--btn);color:#fff}
.tabs svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>

<div id="splash" role="presentation" aria-label="stalltrack from oat">
  <div class="hero">stalltrack</div>
  <div class="tagline">checklist · sales · cash-up</div>
  <div class="from"><span>from</span><span data-wm style="font-size:22px"></span></div>
</div>

<header class="top">
  <span data-wm style="font-size:26px"></span>
  <div class="right">
    <div class="name" id="hname">stalltrack</div>
    <button class="gear" id="gear" aria-label="Settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main>
  <section id="v-ck"></section>
  <section id="v-sales" hidden></section>
  <section id="v-settings" hidden></section>
  <section id="v-cash" hidden></section>
</main>

<nav>
  <div class="tabs" id="tabs" role="tablist">
    <button role="tab" data-v="ck" class="on" aria-selected="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.2 1.2L6.8 5M3.5 12l1.2 1.2L6.8 11M3.5 18l1.2 1.2L6.8 17"/></svg>Checklist
    </button>
    <button role="tab" data-v="sales" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Sales
    </button>
    <button role="tab" data-v="cash" aria-selected="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2.5"/><path d="M8.5 7h7M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/></svg>Cash-up
    </button>
  </div>
</nav>

<script>
"use strict";

/* ---------- helpers ---------- */
var KEY = "stalltrack.v1";
function h(tag, attrs) {
  var el = document.createElement(tag);
  if (attrs) for (var k in attrs) {
    if (k === "class") el.className = attrs[k];
    else if (k === "text") el.textContent = attrs[k];
    else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] === true) el.setAttribute(k, "");
    else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k]);
  }
  for (var i = 2; i < arguments.length; i++) {
    var c = arguments[i];
    if (c == null || c === false) continue;
    el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
  }
  return el;
}
function svg(html) { var d = document.createElement("div"); d.innerHTML = html; return d.firstChild; }
var CHECK = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* oat wordmark: lowercase Quicksand bold, tilted grain as the full stop, set low */
function wordmark(el) {
  el.className = (el.className ? el.className + " " : "") + "wm";
  el.setAttribute("role", "img");
  el.setAttribute("aria-label", "oat");
  el.appendChild(h("span", { text: "oat" }));
  el.appendChild(svg('<svg width=".26em" height=".38em" viewBox="21 17 18 26" aria-hidden="true"><g transform="rotate(-20 30 30)"><ellipse cx="30" cy="30" rx="8" ry="13" fill="currentColor"/><path d="M30 21V39" stroke="#F6F4F1" stroke-width="2.6" stroke-linecap="round"/></g></svg>'));
}
Array.prototype.forEach.call(document.querySelectorAll("[data-wm]"), wordmark);

/* ---------- state (localStorage, always guarded) ---------- */
var state = { v: 1, header: { market: "", date: "", position: "", note: "" }, items: [], packedOpen: false,
  settings: { eftpos: false, bank: false, fee: "" }, buttons: [], sales: [], locked: {}, lastMethod: "cash", cash: {} };
function load() {
  try {
    var raw = localStorage.getItem(KEY);
    if (!raw) return;
    var s = JSON.parse(raw);
    if (!s || typeof s !== "object") return;
    if (s.header && typeof s.header === "object") {
      ["market", "date", "position", "note"].forEach(function (k) {
        if (typeof s.header[k] === "string") state.header[k] = s.header[k];
      });
    }
    if (Array.isArray(s.items)) {
      state.items = s.items.filter(function (i) { return i && typeof i.t === "string" && i.t; }).map(function (i) {
        return { id: String(i.id || uid()), t: i.t, group: typeof i.group === "string" ? i.group : "", done: !!i.done };
      });
    }
    if (s.settings && typeof s.settings === "object") {
      state.settings.eftpos = !!s.settings.eftpos; state.settings.bank = !!s.settings.bank;
      if (typeof s.settings.fee === "string") state.settings.fee = s.settings.fee.slice(0, 6);
    }
    function int(n) { return typeof n === "number" && isFinite(n) ? Math.round(n) : null; }
    if (Array.isArray(s.buttons)) {
      state.buttons = s.buttons.filter(function (b) { return b && typeof b.name === "string" && b.name && ["fixed", "points", "deal"].indexOf(b.type) >= 0; }).map(function (b) {
        return { id: String(b.id || uid()), name: b.name.slice(0, 30), type: b.type, price: int(b.price) || 0,
          prices: Array.isArray(b.prices) ? b.prices.map(int).filter(function (n) { return n > 0; }).slice(0, 8) : [],
          qty: int(b.qty) > 0 ? int(b.qty) : 1, total: int(b.total) || 0 };
      });
    }
    if (Array.isArray(s.sales)) {
      state.sales = s.sales.filter(function (x) { return x && int(x.amount) !== null && typeof x.date === "string"; }).map(function (x) {
        return { id: String(x.id || uid()), ts: int(x.ts) || 0, date: x.date, name: typeof x.name === "string" ? x.name.slice(0, 30) : "Other",
          qty: int(x.qty) > 0 ? int(x.qty) : 1, amount: int(x.amount), method: ["cash", "eftpos", "bank"].indexOf(x.method) >= 0 ? x.method : "cash", check: !!x.check };
      });
    }
    if (s.locked && typeof s.locked === "object") Object.keys(s.locked).forEach(function (k) { if (s.locked[k] === true) state.locked[k] = true; });
    if (s.cash && typeof s.cash === "object") Object.keys(s.cash).forEach(function (k) {
      var c = s.cash[k]; if (!c || typeof c !== "object") return;
      state.cash[k] = { float: int(c.float), counted: int(c.counted), eftpos: int(c.eftpos), bank: int(c.bank),

  var pc = h("div", { class: "card list" }, line("Total sales", money(T.all)), line("− Business expenses", money(T.biz)));
  if (T.fee) pc.appendChild(line("− EFTPOS fee (est.)", money(T.fee)));
  pc.appendChild(line("Net profit", money(T.profit), { bold: true }));
  f.appendChild(pc);
  f.appendChild(h("p", { class: "note", text: "Personal spending: " + money(T.personal) + ". Shown separately, not in profit. Stalltrack gives no tax advice." }));
  return f;
}
function stepResult(c, T) {
  cv.appendChild(resultCards(c, T));
  var unnamed = state.sales.filter(function (s) { return s.date === todayISO() && s.check; }).length;
  if (unnamed) cv.appendChild(h("p", { class: "err", text: "● " + unnamed + " sale" + (unnamed === 1 ? "" : "s") + " still to check in the Sales tab." }));
  cv.appendChild(h("div", { class: "row2" },
    h("button", { class: "btn o", text: "Back", onclick: function () { cui.step = 2; renderCash(); } }),
    h("button", { class: "btn big", text: "Save cash-up", disabled: c.counted == null, onclick: function () {
      if (!confirm("Save this cash-up? Sales for today will be locked until you reopen.")) return;
      c.saved = true; state.locked[todayISO()] = true; save(); askPersist(); renderCash(); renderSales(); window.scrollTo(0, 0);
    } })));
}
function renderSaved(c, T) {
  cv.appendChild(h("div", { class: "lockbar" }, h("div", null, h("b", { text: "Cash-up saved" }), h("span", { text: "Sales are locked." })),
    h("button", { class: "btn", text: "Reopen", onclick: reopenToday })));
  var lb = lastBackup();
  if (lb !== todayISO()) {
    cv.appendChild(h("div", { class: "card", style: "margin-bottom:8px" }, h("b", { text: "Back up your data" }),
      h("p", { class: "note", style: "margin:4px 0 10px", text: "Your records only live on this device. Save a backup now." }),
      h("button", { class: "btn", text: "Back up now", onclick: function () { doBackup().then(function () { renderCash(); }); } })));
  }
  cv.appendChild(resultCards(c, T));
}
renderCash();

/* ---------- tabs ---------- */
document.getElementById("tabs").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  Array.prototype.forEach.call(this.children, function (x) {
    var on = x === b; x.classList.toggle("on", on); x.setAttribute("aria-selected", on ? "true" : "false");
  });
  prevTab = b.dataset.v;
  clearToast();
  if (b.dataset.v === "sales") { ui.mode = "main"; renderSales(); }
  if (b.dataset.v === "cash") renderCash();
  showView(b.dataset.v);
});

/* ---------- offline: service worker + persistent storage ---------- */
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", function () { try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) { /* ignore */ } });
}
if (state.sales.length || state.items.length) askPersist();

/* ---------- splash: about 1 second, tap to skip ---------- */
(function () {
  var s = document.getElementById("splash"), gone = false;
  function hide() { if (gone) return; gone = true; s.classList.add("out"); setTimeout(function () { s.hidden = true; }, 300); }
  s.addEventListener("click", hide);
  setTimeout(hide, 1000);
})();
</script>
</body>
